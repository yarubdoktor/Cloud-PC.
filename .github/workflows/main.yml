name: Clean Windows Cloud PC

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: 'Session duration (15-300 minutes)'
        required: true
        default: '60'
        type: string

jobs:
  windows-rdp:
    runs-on: windows-2022
    timeout-minutes: 330

    steps:
      # 1. الاتصال بشبكة Tailscale عبر الإجراء الرسمي
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      # 2. تنزيل وتثبيت RustDesk مباشرة من المستودع الرسمي
      - name: Download & Install RustDesk
        shell: pwsh
        run: |
          $url = "https://github.com/rustdesk/rustdesk/releases/download/1.3.2/rustdesk-1.3.2-x86_64.exe"
          Invoke-WebRequest -Uri $url -OutFile "rustdesk.exe"
          Start-Process -FilePath ".\rustdesk.exe" -ArgumentList "--silent-install" -Wait

      # 3. تعيين كلمة المرور السرية وإظهار عنوان IP للاتصال
      - name: Configure Password & Show IP
        shell: pwsh
        env:
          R_PASS: ${{ secrets.RUSTDESK_PASSWORD }}
        run: |
          $rustdeskPath = "C:\Program Files\RustDesk\rustdesk.exe"
          & $rustdeskPath --password $env:R_PASS
          Write-Host "=== Tailscale IP Address ==="
          tailscale ip -4

      # 4. إبقاء الجلسة تعمل للمدة المطلوبة
      - name: Keep Alive
        shell: pwsh
        run: |
          $seconds = [int]"${{ github.event.inputs.session_minutes }}" * 60
          Start-Sleep -Seconds $seconds
          
